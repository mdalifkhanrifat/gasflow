# GasFlow development environment.
# Values like ports and passwords come from .env (the same file Laravel reads).

name: gasflow

x-php: &php
    image: gasflow-php:dev
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: dev
        args:
            UID: ${HOST_UID:-1000}
            GID: ${HOST_GID:-1000}
    volumes:
        - ./:/var/www/html
    restart: unless-stopped

services:
    app:
        <<: *php
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong',
                ]
            interval: 15s
            timeout: 3s
            start_period: 10s
            retries: 3

    # Background workers share the app image. "critical" is kept separate so payment
    # and ledger jobs are never stuck behind slow default jobs (e.g. bulk SMS).
    queue-default:
        <<: *php
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--queue=default',
                '--sleep=1',
                '--tries=3',
                '--max-time=3600',
            ]
        stop_grace_period: 60s
        depends_on: &backing-services
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    queue-critical:
        <<: *php
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--queue=critical',
                '--sleep=1',
                '--tries=1',
                '--max-time=3600',
            ]
        stop_grace_period: 60s
        depends_on: *backing-services

    scheduler:
        <<: *php
        command: ['php', 'artisan', 'schedule:work']
        depends_on: *backing-services

    nginx:
        image: nginx:1.30-alpine
        depends_on:
            app:
                condition: service_healthy
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - ./public:/var/www/html/public:ro
            - ./storage/app/public:/var/www/html/storage/app/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/snippets:/etc/nginx/snippets:ro
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
            interval: 15s
            timeout: 3s
            retries: 3
        restart: unless-stopped

    postgres:
        image: postgres:18.7-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?set DB_SUPERUSER_PASSWORD in .env}
            POSTGRES_DB: postgres
            GASFLOW_DB: ${DB_DATABASE:-gasflow}
            GASFLOW_TEST_DB: ${DB_TEST_DATABASE:-gasflow_testing}
            GASFLOW_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
            GASFLOW_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
            GASFLOW_OPERATOR_PASSWORD: ${DB_OPERATOR_PASSWORD:-}
        ports:
            - '127.0.0.1:${DB_FORWARD_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U postgres -d ${DB_DATABASE:-gasflow}',
                ]
            interval: 10s
            timeout: 3s
            start_period: 20s
            retries: 5
        restart: unless-stopped

    redis:
        image: redis:8-alpine
        command:
            - redis-server
            - --requirepass
            - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
            - --appendonly
            - 'yes'
            - --maxmemory-policy
            - noeviction
        environment:
            REDISCLI_AUTH: ${REDIS_PASSWORD}
        ports:
            - '127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    # Vite dev server with HMR (dev profile). Built from the app image plus Node 26,
    # because the Wayfinder plugin runs "php artisan" while Vite is running.
    # node_modules lives in a volume so Linux/musl binaries never mix with the host's.
    node:
        <<: *php
        image: gasflow-php:node
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: node
            args:
                UID: ${HOST_UID:-1000}
                GID: ${HOST_GID:-1000}
        profiles: [dev]
        command:
            - sh
            - -c
            - >-
                cmp -s package-lock.json node_modules/.installed-lock
                || { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.installed-lock; };
                exec npm run dev
        environment:
            DOCKER_VITE: '1'
            NPM_CONFIG_UPDATE_NOTIFIER: 'false'
            DOCKER_VITE_PORT: ${VITE_PORT:-5173}
        ports:
            - '127.0.0.1:${VITE_PORT:-5173}:5173'
        volumes:
            - ./:/var/www/html
            - node-modules:/var/www/html/node_modules

    # Catches every outgoing mail in development (dev profile).
    mailpit:
        image: axllent/mailpit:v1.33
        profiles: [dev]
        ports:
            - '127.0.0.1:${MAILPIT_DASHBOARD_PORT:-8025}:8025'
        healthcheck:
            test: ['CMD', '/mailpit', 'readyz']
            interval: 15s
            timeout: 3s
            retries: 3
        restart: unless-stopped

volumes:
    node-modules:
    postgres-data:
    redis-data:
