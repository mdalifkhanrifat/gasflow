name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# CI runs on the same Docker stack as development (PHP 8.5, PostgreSQL 18.7 with
# the owner/app roles, Redis 8, Node 26), so tests see the real database rules.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create environment file
        run: make env

      - name: Build images
        run: docker compose --profile dev build app node

      - name: Start app, postgres and redis
        run: docker compose up -d --wait app postgres redis

      - name: Install PHP dependencies
        run: docker compose exec -T app composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: docker compose exec -T app php artisan key:generate --no-interaction

      - name: Install and build frontend
        run: docker compose --profile dev run --rm --no-deps -T node sh -c "npm ci --no-audit --no-fund && npm run build"

      - name: Run migrations as the owner role
        run: docker compose exec -T app php artisan migrate --database=pgsql_migrations --force

      - name: PHP checks (Pint, PHPStan, Pest)
        run: docker compose exec -T app composer test

      - name: Frontend checks (lint, format, types)
        run: docker compose --profile dev run --rm --no-deps -T node sh -c "npm run check && npm run types:check"

      - name: Show service logs
        if: failure()
        run: docker compose --profile dev logs --no-color
