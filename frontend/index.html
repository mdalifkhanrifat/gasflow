<!doctype html>
<html lang="bn" data-theme-preference="system">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="icon"
            href="/favicon.ico?v=gasflow-blue"
            type="image/x-icon"
            sizes="16x16 32x32 48x48 64x64"
        />
        <link
            rel="icon"
            href="/favicon.svg?v=gasflow-blue"
            type="image/svg+xml"
            sizes="any"
        />
        <link
            rel="apple-touch-icon"
            href="/apple-touch-icon.png?v=gasflow-blue"
        />
        <!-- Installable app: manifest colors match --surface and --background in tokens.css. -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta
            name="theme-color"
            content="#ffffff"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#151f30"
            media="(prefers-color-scheme: dark)"
        />
        <meta name="apple-mobile-web-app-title" content="GasFlow" />
        <title>GasFlow</title>
        <script>
            (() => {
                const root = document.documentElement;
                let preference = 'system';

                try {
                    const saved = localStorage.getItem('gasflow-theme');
                    if (saved === 'light' || saved === 'dark') {
                        preference = saved;
                    }
                } catch {
                    // Use the system preference if storage is unavailable.
                }

                root.dataset.themePreference = preference;
                root.classList.toggle(
                    'dark',
                    preference === 'dark' ||
                        (preference === 'system' &&
                            matchMedia('(prefers-color-scheme: dark)').matches),
                );
            })();
        </script>
    </head>
    <body class="bg-background font-sans text-ink antialiased">
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
