; GasFlow php-fpm pool overrides (loaded after www.conf).
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Health check endpoints (only reachable inside the Docker network).
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

; Keep container environment variables visible to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
