# GasFlow web server: serves the Vue build and forwards the API to PHP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location ~ ^/(?:api|sanctum|_boost)(?:/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri @frontend;
    }

    location @frontend {
        root /var/www/html/frontend/dist;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # Fingerprinted Vue assets can be cached forever.
    location /assets/ {
        root /var/www/html/frontend/dist;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/(?:favicon\.(?:ico|svg)|apple-touch-icon\.png|robots\.txt)$ {
        root /var/www/html/frontend/dist;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only the front controller is executed; any other .php file is not found.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.env, .git, ...) are never served.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}
